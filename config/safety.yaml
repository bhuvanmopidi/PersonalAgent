# Safety rules used by src/jarvis/safety/policy.py.
# Risk only goes UP: the final level is the max of kind, keyword and flag matches.
# Unknown action kinds default to yellow (confirm).

kinds:
  green:
    [launch_app, close_app, open_url, open_folder, find_file, set_volume, set_brightness,
     lock_screen, hotkey, type_text, click, scroll, read, search, play_media, wait,
     youtube_play, media_key, browser_nav, set_ad_policy, set_llm_provider, llm_status,
     press_key, select_option, find, navigate, go_back, double_click, switch_window, check_file,
     attach_file, open_file, wait_download]
  # change_system_setting: confirmed, not handed over (user's choice, 2026-10-19)
  yellow: [send, submit_form, delete_file, move_file, place_order, change_system_setting]
  payment: [pay]
  red: [enter_password, enter_otp, login, solve_captcha]

# Keywords are matched against the target (the UI label being acted on) only for these kinds —
# plus any unknown kind. Not for e.g. open_url, whose target is a URL built from the user's words.
keyword_kinds: [click, hotkey, press_key, submit_form]

# Matched as whole words/phrases (case-insensitive).
keywords:
  yellow:
    [send, submit, delete, remove, place order, buy now, confirm order, confirm, permanently,
     cancel membership, cancel subscription, cancel plan, unsubscribe, deactivate, close account,
     delete account, transfer, finish cancellation, uninstall, reset]
  payment: [pay now, proceed to pay, place your order and pay, complete payment, make payment]
  red: [password, otp, one-time password, upi pin, cvv, sign in, log in, verify you are human, captcha]

flags:
  # agent_*: the agent planner's own risk hint for a step (an AI risk judge) — can only raise risk
  yellow: [agent_irreversible]
  payment: [agent_payment]
  red: [password_field, otp_field, captcha_detected, agent_credentials]

# Windows settings: a step that CHANGES a value there (flips a switch or box, picks an option,
# types a value — the agent marks these "value_change") is confirmed first. Looking around and
# reading are free. Apps by program name. Administrator prompts are never touched (the agent stops).
settings_apps: [systemsettings, mmc, regedit]

# Files (Phase 11.3). Attaching is free — the Send / Submit question names the attached files
# (user's choice, 2026-10-19). These are never attached or opened (matched against the full path,
# case-insensitive; * = anything): secrets, keys, browser profiles, password vaults, Jarvis's data.
blocked_paths:
  ["*\\.env", "*\\.env.*", "*\\.ssh\\*", "*.pem", "*.key", "*.pfx", "*.p12", "*\\id_rsa*",
   "*\\id_ed25519*", "*.kdbx", "*\\AppData\\*\\User Data\\*", "*\\JarvisAgent\\*",
   "*\\.aws\\*", "*\\.git-credentials", "*.ovpn"]
# Opening one of these runs a program: only after a yes (user's choice).
program_extensions: [.exe, .msi, .bat, .cmd, .ps1, .vbs, .js, .jse, .wsf, .scr, .com, .lnk, .reg]

# Key presses that act at once in many apps — confirm (matched on the normalised combo).
risky_keys:
  yellow: [ctrl+enter, shift+delete, ctrl+shift+delete, alt+s]

# Page context: where a browser action happens raises its risk (never lowers it).
# Checked against action.page_url, and against the target for url_kinds (the target IS a URL).
url_kinds: [open_url, navigate]
url_rules:
  payment:
    path_keywords: [/checkout, /payment, /payments, /pay/, /buy/, /gp/buy, /placeorder, /order/confirm]
    hosts: [razorpay.com, payu.in, paytm.com, ccavenue.com, billdesk.com, cashfree.com, juspay.in,
            phonepe.com, paypal.com, checkout.stripe.com]

# "Verify you are human" checks: never solved by the agent — detected, then handed to you.
captcha:
  iframe_hosts: [google.com/recaptcha, recaptcha.net, hcaptcha.com, challenges.cloudflare.com,
                 arkoselabs.com, funcaptcha.com]
  phrases: [verify you are human, verify you're human, i'm not a robot, i am not a robot,
            are you a robot, unusual traffic from your computer]

# One-tap checkout: a payment action is refused unless all of these are in action.args.
payment_required_fields: [item, quantity, price, address, payment_method]
