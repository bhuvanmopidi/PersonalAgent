# Jarvis runtime settings. Loaded by src/jarvis/config.py.

log_level: INFO

hotkeys:
  kill: esc
  push_to_talk: "<ctrl>+<alt>+j"    # talk without the wake word; "" disables

router:
  mode: hybrid                      # hybrid: rules → LLM · llm_first: LLM → rules (experiment)
  embedding_match_threshold: 0.85   # Tier-2 skill match (Phase 14)
  classifier_threshold: 0.8         # small classifier confidence (Phase 14)

tts:
  engine: piper                     # piper | sapi (built-in Windows voice) | none
  voice: en_US-lessac-medium        # jarvis voices download
  speed: 1.0                        # >1 faster, <1 slower

listen:
  wake_word: hey_jarvis             # bundled openWakeWord model
  wake_threshold: 0.5               # raise if it wakes by mistake, lower if it misses you
  vad_threshold: 0.5
  silence_ms: 700                   # pause that ends a command
  no_speech_timeout_s: 4            # woke up but you said nothing
  max_utterance_s: 15
  wake_sound: true                  # short beep when "Hey Jarvis" is heard
  partials: true                    # live transcript while you speak (GPU only)

stt:
  model: small.en                   # on the GPU (RTX 4050: ~0.2 s per command)
  cpu_model: base.en                # fallback when CUDA isn't available
  device: auto                      # auto | cuda | cpu
  hotwords: [lofi, Jarvis, volume, brightness, mute, unmute]   # + app/site names automatically

browser:
  enabled: true                     # false: links open in your default browser, no automation
  chrome_path: ""                   # "" = find chrome.exe automatically
  profile_dir: ""                   # "" = %LOCALAPPDATA%\JarvisAgent\chrome-profile (separate from your Chrome)
  cdp_port: 9222                    # local remote-control port (127.0.0.1 only)
  launch_timeout_s: 15

llm:                                # understands what the rules don't (Phase 7)
  enabled: true
  online_provider: openrouter       # openrouter | openai | claude | local — offline it's always local
  openrouter_model: anthropic/claude-haiku-5.5   # chosen by benchmark; free alt: nvidia/nemotron-3-super-120b-a12b:free
  openai_model: gpt-4o-mini         # needs OPENAI_API_KEY (+ credits) — optional
  router_model: claude-haiku-5-5    # Claude (needs ANTHROPIC_API_KEY + credits) — optional
  local_model: qwen2.5:3b           # Ollama: `ollama pull qwen2.5:3b`
  ollama_url: http://127.0.0.1:11434
  effort: low
  timeout_s: 8
  model: claude-opus-5-5            # planner model (later phases, direct Anthropic)
  agent_model: anthropic/claude-haiku-5.5   # the general agent (Phase 11), via OpenRouter
  agent_timeout_s: 30

agent:                              # the general agent: does tasks on any website (Phase 11)
  max_steps: 20                     # planning rounds, each 1–5 actions
  time_budget_s: 120
  max_elements: 120                 # page elements shown to the model per step
  max_text_chars: 1500              # page text excerpt per step
