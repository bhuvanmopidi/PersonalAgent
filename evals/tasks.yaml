# Eval tasks — one per capability. Runner added in Phase 16.
#   id, command, expected_intent, expected_tier, check (human-readable for now), max_latency_ms

tasks:
  - { id: open_notepad, command: "open notepad", expected_intent: open_app, expected_tier: 1,
      check: "Notepad window appears", max_latency_ms: 500 }
  - { id: open_alias_app, command: "open vs code", expected_intent: open_app, expected_tier: 1,
      check: "VS Code window appears", max_latency_ms: 800 }
  - { id: open_typo_app, command: "open spotfy", expected_intent: open_app, expected_tier: 1,
      check: "Spotify opens despite the typo", max_latency_ms: 800 }
  - { id: open_site_alias, command: "open youtube", expected_intent: open_app, expected_tier: 1,
      check: "youtube.com opens in the Jarvis Chrome window, not the installed web app", max_latency_ms: 1500 }
  - { id: open_domain, command: "go to github.com", expected_intent: open_app, expected_tier: 1,
      check: "github.com opens", max_latency_ms: 500 }
  - { id: close_notepad, command: "close notepad", expected_intent: close_app, expected_tier: 1,
      check: "Notepad closes (or asks to save)", max_latency_ms: 800 }
  - { id: youtube_search, command: "play lofi on youtube", expected_intent: youtube_search,
      expected_tier: 1, check: "YouTube results for 'lofi'", max_latency_ms: 500 }
  - { id: web_search, command: "google best earbuds under 2000", expected_intent: web_search,
      expected_tier: 1, check: "Google results page", max_latency_ms: 500 }
  - { id: volume_set, command: "volume 30", expected_intent: volume_set, expected_tier: 1,
      check: "system volume = 30%", max_latency_ms: 300 }
  - { id: volume_up, command: "volume up", expected_intent: volume_up, expected_tier: 1,
      check: "volume +10", max_latency_ms: 300 }
  - { id: mute, command: "mute", expected_intent: mute, expected_tier: 1,
      check: "speakers muted", max_latency_ms: 300 }
  - { id: brightness_set, command: "brightness 50", expected_intent: brightness_set,
      expected_tier: 1, check: "built-in display at 50%", max_latency_ms: 800 }
  - { id: open_downloads, command: "open downloads", expected_intent: open_folder,
      expected_tier: 1, check: "Explorer opens Downloads", max_latency_ms: 500 }
  - { id: find_file, command: "find my resume", expected_intent: find_file, expected_tier: 1,
      check: "Explorer opens with the resume selected", max_latency_ms: 2000 }
  - { id: lock, command: "lock the screen", expected_intent: lock, expected_tier: 1,
      check: "Windows lock screen", max_latency_ms: 300 }
  # ---- voice out (Phase 3) ----
  - { id: tts_short_phrase, command: "volume 24", expected_intent: volume_set, expected_tier: 1,
      check: "'Volume 24%' spoken; first audio after prewarm", max_latency_ms: 150 }
  - { id: tts_failure_spoken, command: "open blahblah", expected_intent: open_app, expected_tier: 1,
      check: "failure sentence spoken, start phrase cut off", max_latency_ms: 400 }
  # ---- voice in (Phase 4) — spoken, measured from end of speech ----
  - { id: voice_open_app, spoken: "Hey Jarvis, open Spotify", expected_intent: open_app,
      expected_tier: 1, check: "transcript 'open spotify'; Spotify opens", max_latency_ms: 1200 }
  - { id: voice_one_breath, spoken: "Hey Jarvis open notepad (no pause)", expected_intent: open_app,
      expected_tier: 1, check: "command not cut off after the wake word", max_latency_ms: 1200 }
  - { id: voice_push_to_talk, spoken: "<ctrl+alt+j> volume 30", expected_intent: volume_set,
      expected_tier: 1, check: "works without the wake word", max_latency_ms: 1200 }
  - { id: voice_stop, spoken: "stop (while a task runs, no wake word)", expected_intent: control,
      expected_tier: 0, check: "task cancelled, speech stops", max_latency_ms: 1200 }
  - { id: voice_confirm_yes, spoken: "yes (after a confirmation prompt)", expected_intent: control,
      expected_tier: 0, check: "action proceeds", max_latency_ms: 1200 }
  - { id: voice_unclear_is_no, spoken: "hmm … what (after a confirmation prompt)",
      expected_intent: control, expected_tier: 0, check: "asked again once, then cancelled",
      max_latency_ms: 25000 }
  - { id: voice_false_wake, spoken: "Hey Travis / ordinary conversation", expected_intent: none,
      expected_tier: 0, check: "does not wake", max_latency_ms: 0 }
  # ---- browser (Phase 5): Jarvis Chrome over CDP ----
  - { id: yt_play, command: "play lofi on youtube", expected_intent: youtube_play, expected_tier: 1,
      check: "a non-ad, non-Short video is playing; 'Playing: <title>'", max_latency_ms: 5000 }
  - { id: yt_play_music_query, command: "play arijit singh songs on youtube",
      expected_intent: youtube_play, expected_tier: 1,
      check: "plays (results carry YouTube's &list=RD radio queue)", max_latency_ms: 5000 }
  - { id: yt_pause_resume, command: "pause / resume", expected_intent: media_pause, expected_tier: 1,
      check: "video paused, then playing", max_latency_ms: 300 }
  - { id: yt_next, command: "next video", expected_intent: next_video, expected_tier: 1,
      check: "Shift+N sent; fails cleanly when no video is open", max_latency_ms: 300 }
  - { id: yt_ad_ask, command: "play X on youtube (ad with Skip)", expected_intent: youtube_play,
      expected_tier: 1, check: "ad muted, 'Skip it?' asked; yes skips, no/8 s leaves it",
      max_latency_ms: 15000 }
  - { id: open_site_in_jarvis_chrome, command: "open instagram", expected_intent: open_app,
      expected_tier: 1, check: "opens in the Jarvis Chrome window", max_latency_ms: 1500 }
  - { id: tab_nav, command: "go back / new tab / close this tab", expected_intent: go_back,
      expected_tier: 1, check: "current tab navigates", max_latency_ms: 300 }
  - { id: captcha_handoff, command: "open <page with reCAPTCHA>", expected_intent: open_app,
      expected_tier: 1, check: "handoff spoken; resumes when the check disappears; never solved",
      max_latency_ms: 600000 }
  - { id: checkout_page_risk, command: "pause (on a /checkout page)", expected_intent: media_pause,
      expected_tier: 1, check: "raised to PAYMENT, refused", max_latency_ms: 300 }
  - { id: chrome_down_no_fallback, command: "play lofi on youtube (Chrome can't start)",
      expected_intent: youtube_play, expected_tier: 1,
      check: "fails with 'couldn't open the Jarvis Chrome window'; nothing opens elsewhere",
      max_latency_ms: 20000 }
  - { id: web_app_as_website, command: "open gmail (Gmail PWA installed)", expected_intent: open_app,
      expected_tier: 1, check: "mail.google.com in the Jarvis Chrome window, PWA not launched",
      max_latency_ms: 1500 }
  - { id: yt_error_page, command: "play lofi on youtube (YouTube redirects to /oops)",
      expected_intent: youtube_play, expected_tier: 1,
      check: "fails in ~2 s with the account message, not 'took too long'", max_latency_ms: 3000 }
  - { id: yt_seek, command: "fast forward by 10 min / rewind 30 seconds / go to 1:00",
      expected_intent: media_forward, expected_tier: 1,
      check: "currentTime moves exactly; 'At m:ss of h:mm:ss'", max_latency_ms: 300 }
  - { id: yt_speed, command: "speed 1.5x / slower / normal speed", expected_intent: media_speed,
      expected_tier: 1, check: "playbackRate 1.5 → 1.25 → 1", max_latency_ms: 300 }
  - { id: yt_seek_live, command: "fast forward (on a live stream)", expected_intent: media_forward,
      expected_tier: 1, check: "refused: live stream", max_latency_ms: 300 }
  # ---- LLM layer (Phase 7) ----
  - { id: llm_paraphrase, command: "make it louder bro", expected_intent: volume_up, expected_tier: 1,
      check: "rules miss → LLM → volume_up through ActionRunner", max_latency_ms: 2000 }
  - { id: llm_question, command: "what all can you do", expected_intent: none, expected_tier: 0,
      check: "spoken answer from the capability list; nothing executed", max_latency_ms: 2500 }
  - { id: llm_unsupported, command: "send a whatsapp to mom", expected_intent: none, expected_tier: 0,
      check: "'I can't do that yet' with a reason; nothing executed", max_latency_ms: 2500 }
  - { id: llm_offline, command: "make it louder bro (Wi-Fi off)", expected_intent: volume_up,
      expected_tier: 1, check: "local model answers; Claude not waited on", max_latency_ms: 2500 }
  - { id: llm_pronoun, command: "open it (no context)", expected_intent: none, expected_tier: 0,
      check: "never opens an app called 'it'; asks which one", max_latency_ms: 2500 }
  - { id: llm_switch, command: "use the local model / which model are you using",
      expected_intent: use_local_model, expected_tier: 1, check: "provider switched and reported",
      max_latency_ms: 300 }
