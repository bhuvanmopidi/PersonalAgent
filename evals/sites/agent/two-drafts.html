<!doctype html>
<html><head><title>QuickMail - two drafts</title></head>
<body>
  <!-- two compose windows open at once: an old draft with a file, and a new empty one -->
  <div role="dialog" aria-label="Old draft">
    <label>To <input type="text" aria-label="To recipients" value="old@example.com"></label>
    <p>Attachment: Resume_Old.pdf</p>
    <button>Send</button>
  </div>
  <div role="dialog" aria-label="New message">
    <label>To <input type="text" aria-label="To recipients" value="arjun@example.com"></label>
    <button aria-label="Attach files">Attach</button>
    <button>Send</button>
  </div>
</body></html>
