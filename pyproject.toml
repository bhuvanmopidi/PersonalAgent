[project]
name = "jarvis-agent"
version = "0.1.0"
description = "Voice-controlled computer-use agent for Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "nvidia-cublas-cu12>=12.9.2.10 ; sys_platform == 'win32'",
    "openwakeword>=0.4.0",
    "piper-tts>=1.8.0",
    "playwright>=1.64.0",
    "psutil>=7.2.2",
    "pycaw>=20260927",
    "pydantic>=2.7",
    "pynput>=1.8.2",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14.6",
    "screen-brightness-control>=0.27.2",
    "sounddevice>=0.5.6",
]

[project.scripts]
jarvis = "jarvis.main:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "types-pynput>=1.8.1.20260712",
    "types-psutil>=7.2.2.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "pycaw.*", "screen_brightness_control.*", "sounddevice", "win32com.*", "pythoncom",
    "openwakeword.*", "openwakeword", "faster_whisper.*", "faster_whisper",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["desktop: touches the real desktop (launches apps, changes volume); run with -m desktop"]
addopts = "-m 'not desktop'"
